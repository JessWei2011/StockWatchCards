<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股觀察卡片</title>
<link rel="stylesheet" href="style.css?v=28">
</head>
<body>

<header>
  <h1>📌 個股觀察卡片</h1>
  <input id="search" type="text" placeholder="搜尋代號 / 名稱...">
  <span id="count"></span>
  <div class="color-filter" id="colorFilter">
    <button type="button" class="active" data-filter="all">全顯示</button>
    <button type="button" class="dot-buy" data-filter="buy">🟢 綠卡</button>
    <button type="button" class="dot-hold" data-filter="hold">🔵 藍卡</button>
    <button type="button" class="dot-sell" data-filter="sell">🔴 紅卡</button>
  </div>
  <select id="groupFilterSelect" class="group-filter-select" title="依分組篩選">
    <option value="all">🗂️ 全部分類</option>
  </select>
  <div class="font-ctrl" title="調整顯示文字大小">
    <span class="font-ctrl-label">🔠</span>
    <button type="button" id="fontDown" title="縮小文字">A-</button>
    <span id="fontPct">100%</span>
    <button type="button" id="fontUp" title="放大文字">A+</button>
  </div>
</header>

<main>
  <div id="grid"></div>
</main>

<div class="modal-overlay hidden" id="confirmModal">
  <div class="modal">
    <h3>✕ 移除卡片</h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="confirmCancel">取消</button>
      <button type="button" class="btn danger" id="confirmOk">移除</button>
    </div>
  </div>
</div>

<script src="data.js?v=28"></script>
<script src="render.js?v=28"></script>
</body>
</html>

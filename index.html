<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股觀察卡片</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header>
  <h1>📌 個股觀察卡片</h1>
  <input id="search" type="text" placeholder="搜尋代號 / 名稱...">
  <span id="count"></span>
</header>

<main>
  <div id="grid"></div>
</main>

<div class="modal-overlay hidden" id="groupModal">
  <div class="modal">
    <h3>🏷️ 設定分組</h3>
    <input id="groupInput" list="groupList" placeholder="輸入或從清單選擇分組名稱" autocomplete="off">
    <datalist id="groupList"></datalist>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="groupClear">移回未分組</button>
      <button type="button" class="btn ghost" id="groupCancel">取消</button>
      <button type="button" class="btn primary" id="groupSave">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="confirmModal">
  <div class="modal">
    <h3>✕ 移除卡片</h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="confirmCancel">取消</button>
      <button type="button" class="btn danger" id="confirmOk">移除</button>
    </div>
  </div>
</div>

<script src="data.js?v=2"></script>
<script src="render.js?v=2"></script>
</body>
</html>
